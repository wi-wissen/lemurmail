expose_php = Off
memory_limit = 256M
max_execution_time = 60
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code is immutable inside the image, so stat calls are unnecessary.
opcache.validate_timestamps = 0
